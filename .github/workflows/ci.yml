name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    name: Build, lint/format, and test gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotificationSystem.sln

      - name: Lint/Format (basic)
        run: dotnet format NotificationSystem.sln --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build NotificationSystem.sln --configuration Release --no-restore

      - name: Unit tests (gate 1/3)
        run: dotnet test tests/UnitTests/UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Integration tests (gate 2/3)
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      - name: E2E tests (gate 3/3)
        run: dotnet test tests/E2ETests/E2ETests.csproj --configuration Release --no-build --verbosity normal
