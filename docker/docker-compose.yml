name: notification-system-dev

services:
  postgres:
    image: postgres:16
    container_name: notification-system-postgres
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${DB_NAME:-notification}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-notification}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-system-rabbitmq
    env_file:
      - path: ../.env
        required: false
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: notification-system-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification-network

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: notification-system-api
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__Database: ${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=${DB_NAME:-notification};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}}
      JWT_ISSUER: ${JWT_ISSUER:-notification-system-dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-notification-system-dev}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-change-this-signing-key-min-32-chars-000000}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@notification.local}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: notification-system-worker
    env_file:
      - path: ../.env
        required: false
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ConnectionStrings__Database: ${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=${DB_NAME:-notification};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@notification.local}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network

  admin-ui:
    build:
      context: ..
      dockerfile: docker/admin-ui.Dockerfile
    container_name: notification-system-admin-ui
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - notification-network

networks:
  notification-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
