name: notification-system-dev

services:
  postgres:
    image: postgres:16
    container_name: notification-system-postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notification-system-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: notification-system-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification-network

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: notification-system-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=notification;Username=postgres;Password=postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: notification-system-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=notification;Username=postgres;Password=postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-network

  admin-ui:
    build:
      context: ..
      dockerfile: docker/admin-ui.Dockerfile
    container_name: notification-system-admin-ui
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - notification-network

networks:
  notification-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
